<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: #000; color: #f5f5f7; height: 100vh; display: flex; flex-direction: column; padding: 32px 48px; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: 20px; font-size: 26px; line-height: 1.45; }
  .msg { padding: 18px 24px; border-radius: 18px; max-width: 85%; white-space: pre-wrap; }
  .user { background: #1c1c1e; align-self: flex-end; color: #fff; border: 1px solid #3a3a3c; }
  .ai { background: #111; align-self: flex-start; color: #e5e5ea; border: 1px solid #2c2c2e; }
  #bar { display: flex; gap: 14px; padding-top: 12px; }
  input { flex: 1; background: #1c1c1e; border: 2px solid #3a3a3c; color: #fff; font-size: 26px; padding: 16px 22px; border-radius: 16px; outline: none; }
  input:focus { border-color: #fff; }
  button { background: #fff; color: #000; border: none; font-size: 24px; font-weight: 700; padding: 0 32px; border-radius: 16px; cursor: pointer; }
  button:focus { outline: 4px solid #8e8e93; }
</style>
</head>
<body>
  <div id="chat"><div class="msg ai">Ready. Type or use voice typing on your Fire TV remote.</div></div>
  <div id="bar">
    <input id="q" type="text" placeholder="Ask anything..." autofocus />
    <button id="send" onclick="ask()">Send</button>
  </div>
<script>
  const API_KEY = "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";
  const chat = document.getElementById("chat");
  const q = document.getElementById("q");
  let history = [{ role: "system", content: "You are a concise, fast TV assistant. Keep answers clear, direct, and easy to read on a TV screen." }];

  q.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

  async function ask() {
    const text = q.value.trim();
    if (!text) return;
    q.value = "";
    addMsg(text, "user");
    history.push({ role: "user", content: text });
    const loading = addMsg("Thinking...", "ai");

    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
        body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: history })
      });
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || data.error?.message || "Error getting response.";
      loading.textContent = reply;
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      loading.textContent = "Network error. Check Wi-Fi.";
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }
</script>
</body>
</html>
