<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TV AI</title>
    <style>
        body {
            background: #0a0f1c;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: -10px;
        }
        input, button, textarea {
            width: 100%;
            padding: 20px;
            font-size: 1.2rem;
            border-radius: 12px;
            border: 2px solid #555;
            box-sizing: border-box;
        }
        input, textarea {
            background: #151f38;
            color: white;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0,123,255,0.5);
        }
        button {
            background: #e50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:focus {
            outline: none;
            background: #ff0d1a;
            box-shadow: 0 0 10px rgba(229,9,20,0.8);
            transform: scale(1.01);
        }
        #responseArea {
            background: #151f38;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            min-height: 150px;
            white-space: pre-wrap;
            display: none;
            font-size: 1.1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <label for="apiKey">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
:</label>
        <input type="password" id="apiKey" placeholder="AIZSy..." tabindex="1">

        <input type="text" id="userInput" placeholder="Ask anything..." autofocus tabindex="2">
        <button id="sendBtn" tabindex="3">Send</button>

        <div id="responseArea"></div>
    </div>

    <script>
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const responseArea = document.getElementById('responseArea');

        inputField.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendBtn.focus();
            }
        });

        sendBtn.addEventListener('click', async function() {
            const apiKey = apiKeyInput.value.trim();
            const prompt = inputField.value.trim();

            if (!apiKey) {
                alert("Please enter your API Key.");
                apiKeyInput.focus();
                return;
            }
            if (!prompt) {
                alert("Please enter a question.");
                inputField.focus();
                return;
            }

            responseArea.style.display = 'block';
            responseArea.innerText = "Thinking...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    responseArea.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    responseArea.innerText = "Error: No response generated. Check your API key.";
                }
            } catch (error) {
                responseArea.innerText = "Connection error. Please check your network.";
            }
        });
    </script>
</body>
</html>
